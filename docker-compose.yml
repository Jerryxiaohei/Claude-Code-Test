version: '3.8'

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: synscale-postgres
    environment:
      POSTGRES_USER: synscale
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: synscale_dev
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - synscale-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synscale"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: synscale-redis
    command: redis-server --appendonly yes --requirepass dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - synscale-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: synscale-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "8080:8080"
    networks:
      - synscale-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: synscale-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:dev_password
    ports:
      - "8081:8081"
    networks:
      - synscale-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  synscale-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
